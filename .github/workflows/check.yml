name: Check agd

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      # Run every OS to the end, so a failure on one doesn't hide the result of the other.
      fail-fast: false
      matrix:
        # On macOS the tests run agd with /bin/bash, which is bash 3.2, the oldest bash it supports.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Syntax
        run: for script in bin/agd install.sh scripts/*.sh; do bash -n "$script" || exit 1; done
      - name: Tests
        run: python3 -m unittest discover -s tests -v
