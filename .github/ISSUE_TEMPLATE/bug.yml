name: Bug
description: agd did something wrong, or said something unclear.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran and its full output.
      render: console
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: agd --version
      placeholder: agd 0.1.1
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: OS and bash --version
      placeholder: macOS 15, GNU bash 3.2.57
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: The source and version you installed, if it is public, for example Zejnilovic/agentic-defaults@0.3.0.
