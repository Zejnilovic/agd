# The documentation site, https://zejnilovic.github.io/agd, built from docs/ by the Docs workflow.
# Preview it: pip install -r docs/requirements.txt, then mkdocs serve.
site_name: agd
site_description: Install, update and combine agentic setups (instructions, agents, skills, hooks) from git repositories, without overwriting what your project changed.
site_url: https://zejnilovic.github.io/agd/
repo_url: https://github.com/Zejnilovic/agd
repo_name: Zejnilovic/agd
edit_uri: edit/main/docs/
copyright: MIT License © Sasa Zejnilovic

exclude_docs: |
  overrides/
  requirements.txt

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: B612
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Zejnilovic/agd
      name: agd on GitHub

nav:
  - Home: index.md
  - Get started:
      - Install: install.md
      - Quick start: quick-start.md
      - How agd works: concepts.md
  - Guides:
      - Choose packs: guides/packs.md
      - Keep it up to date: guides/updates.md
      - Make files your own: guides/your-changes.md
      - Combine sources: guides/combine-sources.md
      - Adopt a copy: guides/adopt.md
      - Publish your own setup: sources.md
  - Reference:
      - Commands: reference/commands.md
      - Files: reference/files.md
      - FAQ: faq.md
      - Releases: https://github.com/Zejnilovic/agd/releases

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
