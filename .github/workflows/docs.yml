name: Docs

# Builds the documentation site from docs/ and mkdocs.yml, and publishes it to GitHub Pages from main.
# Pull requests only build it; --strict fails the build on a broken link.
# agd-update.yml is in the paths because docs/guides/automatic-updates.md includes it.
on:
  push:
    branches: [main]
    paths: [docs/**, mkdocs.yml, .github/workflows/docs.yml, .github/workflows/agd-update.yml]
  pull_request:
    paths: [docs/**, mkdocs.yml, .github/workflows/docs.yml, .github/workflows/agd-update.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  # Never cancel a deployment halfway; a newer pull request build replaces an older one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Build
        run: |
          pip install -r docs/requirements.txt
          mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
