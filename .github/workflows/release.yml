name: Release

# Releases VERSION: dates its CHANGELOG.md entry, tags the release commit v<version>, creates the GitHub
# release with the archive agd-<version>.tar.gz, the plain script agd and their SHA256SUMS, and points the
# formula in Zejnilovic/homebrew-tap at the archive. Then it installs the release every documented way.
# Start it from the Actions tab. A dry run does everything but push, and shows the notes and the formula.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Prepare the release and show the notes and the formula, but push nothing
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    # Release only from the default branch, never from a feature branch.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Checks before release
        run: |
          bash -n bin/agd
          python3 -m unittest discover -s tests
      - name: Date the changelog entry and write the notes
        id: prepare
        run: |
          NOTES="$RUNNER_TEMP/notes.md"
          version=$(bash scripts/release.sh --notes "$NOTES")
          grep -qx "version=$version" bin/agd || { echo "bin/agd's version= line doesn't match VERSION $version"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then echo "v$version is already released"; exit 1; fi
          { echo "VERSION=$version"; echo "NOTES=$NOTES"; echo "DIST=$RUNNER_TEMP/dist"; echo "ARCHIVE=$RUNNER_TEMP/dist/agd-$version.tar.gz"; } >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Commit, tag and build the release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -q -am "Release $VERSION"
          git tag -a "v$VERSION" -m "Release $VERSION"
          mkdir -p "$DIST"
          git archive --format=tar.gz --prefix="agd-$VERSION/" -o "$ARCHIVE" "v$VERSION"
          # The plain script, for installs by hand from releases/latest/download/agd.
          git show "v$VERSION:bin/agd" > "$DIST/agd"
          (cd "$DIST" && sha256sum "agd-$VERSION.tar.gz" agd > SHA256SUMS)
          echo "SHA256=$(sha256sum "$ARCHIVE" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Write the formula
        run: |
          git clone -q --depth 1 https://github.com/Zejnilovic/homebrew-tap.git "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Formula"
          bash scripts/formula.sh "$VERSION" "$SHA256" > "$RUNNER_TEMP/tap/Formula/agd.rb"
          # The summary keeps the notes and the formula, so a failed last step can be finished by hand.
          { echo "## Release notes for $VERSION"; echo; cat "$NOTES"; echo
            echo '## Formula/agd.rb in Zejnilovic/homebrew-tap'; echo; echo '```diff'
            git -C "$RUNNER_TEMP/tap" add -N Formula/agd.rb
            git -C "$RUNNER_TEMP/tap" diff
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Push the commit and tag
        if: ${{ !inputs.dry_run }}
        run: git push --atomic origin "HEAD:$GITHUB_REF_NAME" "v$VERSION"
      - name: Create the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --verify-tag --title "$VERSION" --notes-file "$NOTES" "$ARCHIVE" "$DIST/agd" "$DIST/SHA256SUMS"
      - name: Update the formula in the tap
        if: ${{ !inputs.dry_run }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add Formula/agd.rb
          git commit -q -m "agd $VERSION"
          git push -q "https://x-access-token:$TAP_TOKEN@github.com/Zejnilovic/homebrew-tap.git" HEAD

  verify:
    # Installs the new release the way people will, and runs the formula's test.
    needs: release
    if: ${{ !inputs.dry_run }}
    runs-on: macos-latest
    steps:
      - name: Install from the tap and test
        run: |
          brew tap zejnilovic/tap
          brew install zejnilovic/tap/agd
          brew test zejnilovic/tap/agd
          brew audit --strict --online zejnilovic/tap/agd
          test "$(agd --version)" = "agd ${{ needs.release.outputs.version }}"

  verify-without-brew:
    # Installs the new release the two ways that need no Homebrew, as the install page shows them.
    needs: release
    if: ${{ !inputs.dry_run }}
    strategy:
      fail-fast: false
      matrix:
        # Windows runs these steps in Git Bash.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Install with install.sh
        run: |
          curl -fsSL https://raw.githubusercontent.com/Zejnilovic/agd/main/install.sh | bash -s -- --dir "$RUNNER_TEMP/script"
          test "$(bash "$RUNNER_TEMP/script/agd" --version)" = "agd $VERSION"
      - name: Download the plain script and check it
        run: |
          mkdir "$RUNNER_TEMP/plain" && cd "$RUNNER_TEMP/plain"
          curl -fsSLO https://github.com/Zejnilovic/agd/releases/latest/download/agd
          curl -fsSLO https://github.com/Zejnilovic/agd/releases/latest/download/SHA256SUMS
          if command -v sha256sum >/dev/null; then sha256sum -c --ignore-missing SHA256SUMS; else shasum -a 256 -c --ignore-missing SHA256SUMS; fi
          test "$(bash agd --version)" = "agd $VERSION"
