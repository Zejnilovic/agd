# Keeps this repository's agentic setup up to date: weekly, agd-action runs agd update and opens a pull request
# with the changes. docs/guides/automatic-updates.md shows this file; any project can copy it as is.
name: Update the agentic setup

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The action commits through GitHub's API, so the token needn't stay in .git/config.
          persist-credentials: false
      - uses: Zejnilovic/agd-action@v1
